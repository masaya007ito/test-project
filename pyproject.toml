[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heliocentric-chart"
version = "1.0.0"
description = "Heliocentric astrology chart generator"
requires-python = ">=3.9"
dependencies = [
    "pyswisseph>=2.10.0",
    "flask>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
heliochart = "heliocentric.cli:main"
heliochart-web = "heliocentric.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
